name: Test Verification Loop

on:
  # run workflow manually to run custom test configurations
  workflow_dispatch:
    inputs:
      
      command:
        description: "Test ant command"
        required: true
        default: "-Dtest-unit-sys-prop.ignore.random.failures=true -f java/api.java test"
        type: string
        
      iterations:
        description: "Number of Iterations (note: 60min timeout)"
        required: true
        default: "10"
        type: choice
        options:
          - "1"
          - "10"
          - "25"
          - "100"
        
      jdk_vendor:
        description: "JDK vendor to use"
        required: true
        default: "temurin"
        type: choice
        options:
          - "corretto"
          - "dragonwell"
          - "graalvm"
          - "graalvm-community"
          - "jetbrains"
          - "kona"
          - "liberica"
          - "liberica-nik"
          - "microsoft"
          - "oracle"
          - "oracle-openjdk"
          - "redhat"
          - "sapmachine"
          - "semeru"
          - "temurin"
          - "zulu"

      jdk_version:
        description: "JDK version to use"
        required: true
        default: "25"
        type: string
        
      os_runner:
        description: "OS Runner"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
          - "ubuntu-26.04-arm"
          - "windows-11-arm"
          
      stop_on_failure:
        description: "Stop on Failure? (note: job will appear green if disabled -> check the steps)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# cancel other workflow run in the same head-base group if it exists
concurrency: 
  group: dep-checker-${{ github.head_ref || github.run_id }}-${{ github.base_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  verification-loop:
    name: Loop ${{ inputs.iterations }}x on ${{ inputs.os_runner }}, ${{ inputs.jdk_vendor }} ${{ inputs.jdk_version }}
    runs-on: ${{ inputs.os_runner }}
    timeout-minutes: 60
    steps:

      - name: Checkout ${{ github.ref }} ( ${{ github.sha }} )
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Set up ${{ inputs.jdk_vendor }} ${{ inputs.jdk_version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.jdk_version }}
          distribution: ${{ inputs.jdk_vendor }}
          problem-matcher: false

      - name: Restoring dependencies from cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.hgexternalcache
          key: ${{ runner.os }}-${{ hashFiles('*/external/binaries-list', '*/*/external/binaries-list') }}
          restore-keys: ${{ runner.os }}-

      - name: Build NetBeans
        run: ant -quiet -Dcluster.config=full build-nozip

      - name: Setup Xvfb
        if: contains(matrix.os, 'ubuntu') && success()
        run: |
          echo "DISPLAY=:99.0" >> $GITHUB_ENV
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      #  branched loop unrolling using yaml, yey!

      - &run-test
        name: Run Test
        if: ${{ steps.check1.outputs.stop_tests != 'true' && steps.check2.outputs.stop_tests != 'true' && steps.check3.outputs.stop_tests != 'true' }}
        continue-on-error: ${{ !inputs.stop_on_failure }}
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -c "ant $COMMAND"

      - name: Stop after 1?
        if: ${{ inputs.iterations == '1' }}
        id: check1
        run: echo "stop_tests=true" >> "$GITHUB_OUTPUT"

      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
#10

      - name: Stop after 10?
        if: ${{ inputs.iterations == '10' }}
        id: check2
        run: echo "stop_tests=true" >> "$GITHUB_OUTPUT"

      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
      - *run-test
#20

