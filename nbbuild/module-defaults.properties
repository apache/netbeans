# Default property values for module (NBM) builds.
#
# Loaded by:
#   - all ant builds via default-properties.xml (before the module's
#     nbproject/project.properties, so modules can override these values), and
#   - the NBM project property evaluator in the IDE (Apisupport Evaluator).
#
# Use the "default." prefix for keys so that they are clearly overridable
# defaults and do not clash with properties used by other builds that also
# import default-properties.xml (root build, harness, javadoc, ...).

# javac --release used by modules which declare none of
# javac.release / javac.source / javac.target
default.javac.release=21
