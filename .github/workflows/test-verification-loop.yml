      - name: Upload Test XMLs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "./*/*/build/test/*/results/TEST-*.xml"
          retention-days: 7

      - name: Create Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        if: always()
        with:
