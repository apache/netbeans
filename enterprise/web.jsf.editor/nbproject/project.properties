javac.release=17
javac.compilerargs=-Xlint -Xlint:-serial

test-unit-sys-prop.web.project.jars=\
    ${web.jsf20.dir}/modules/ext/jsf-2_2/javax.faces.jar:\
    ${servletjspapi.dir}/modules/ext/servlet4.0-jsp2.3-api.jar

requires.nb.javac=true

release.external/generated-jsf-api-docs-2.3.zip=docs/jsf-api-docs.zip

test-unit-sys-prop.netbeans.dirs=${netbeans.dest.dir}/${nb.cluster.enterprise.dir}
# Force JDK impl to avoid a ClassCastException from the old Xerces 2.8.0 (libs.xerces)
# leaking onto the unit-test classpath and clashing with jdk.xml.internal.XMLSecurityManager.
test-unit-sys-prop.javax.xml.parsers.SAXParserFactory=com.sun.org.apache.xerces.internal.jaxp.SAXParserFactoryImpl
test-unit-sys-prop.javax.xml.transform.TransformerFactory=com.sun.org.apache.xalan.internal.xsltc.trax.TransformerFactoryImpl

test.config.stableBTD.includes=**/*Test.class
test.config.stableBTD.excludes=\
    **/JsfDocumentationTest.class,\
    **/JsfPageMetadataProviderTest.class
